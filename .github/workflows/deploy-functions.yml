# Il Worker del modulo contatti (apps/functions, docs/guidances/functions.md)
# su form.wearebutik.com. Parte quando cambia apps/functions su main.
#
# Prima del primo deploy, nel pannello Cloudflare:
# Email Routing attivo su wearebutik.it (la zona da cui parte la mail) e
# info@wearebutik.com fra gli indirizzi di destinazione verificati; un widget
# Turnstile per beta.wearebutik.com e wearebutik.com. Il segreto del widget va
# nel secret del repo TURNSTILE_SECRET.
name: Deploy form (Cloudflare)

on:
  push:
    branches: [main]
    paths:
      - 'apps/functions/**'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:

concurrency:
  group: form
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/prepara

      - run: pnpm --filter @butik/functions test

      - name: Cloudflare Workers
        working-directory: apps/functions
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
        run: |
          pnpm dlx wrangler@4.154.0 deploy
          printf '%s' "$TURNSTILE_SECRET" | pnpm dlx wrangler@4.154.0 secret put TURNSTILE_SECRET
