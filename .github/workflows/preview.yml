name: Preview (Service Worker)

# L'anteprima delle bozze che gira nel browser (apps/web/preview): il sito come
# server, impacchettato in un Service Worker, pubblicato su Cloudflare
# Workers (`butik-anteprima`, preview.wearebutik.com; apps/web/preview/
# wrangler.jsonc; ADR-0004). Chi
# vede le bozze lo decide la sessione Sanity nel worker. Contiene solo il
# codice: si ripubblica quando cambia il codice del sito, non quando si
# pubblica nello Studio.
on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'mise.toml'
      - '.github/workflows/preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/prepara

      # Nessuna variabile PUBLIC_*: l'anteprima non ha analytics né form.
      - run: pnpm --filter @butik/web build:preview

      - name: Cloudflare Workers
        working-directory: apps/web/preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm dlx wrangler@4.154.0 deploy
