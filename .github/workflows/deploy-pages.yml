name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Pubblicazione nello Studio Sanity: il webhook del progetto chiama
  # POST /repos/{owner}/{repo}/dispatches con event_type "sanity-publish"
  # (dataset production, versione A) o "sanity-publish-b" (dataset anteprima,
  # versione B su /b/) — ADR-0004. Ogni build ricostruisce entrambe le
  # versioni. Pubblicazioni ravvicinate si accorpano grazie alla concurrency
  # qui sotto: parte il build dell'ultima.
  repository_dispatch:
    types: [sanity-publish, sanity-publish-b]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Due build nello stesso artefatto (ADR-0004): la versione A da
      # `production` nella radice di dist/, la B da `anteprima` in dist/b/.
      - name: Build
        env:
          SITE: https://wearebutik.github.io
          # Tutte le chiavi PUBLIC_* sono client-side: finiscono nel bundle statico
          # per design, quindi NON sono segreti → repository *variables*, non
          # secrets. Se una variable manca, la feature relativa è un no-op e il
          # build resta verde. (turbo envMode: loose le lascia passare al build.)
          PUBLIC_WEB3FORMS_ACCESS_KEY: ${{ vars.PUBLIC_WEB3FORMS_ACCESS_KEY }}
          PUBLIC_POSTHOG_KEY: ${{ vars.PUBLIC_POSTHOG_KEY }}
          PUBLIC_POSTHOG_HOST: ${{ vars.PUBLIC_POSTHOG_HOST }}
          PUBLIC_GTM_ID: ${{ vars.PUBLIC_GTM_ID }}
        run: pnpm build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
