name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Pubblicazione nello Studio Sanity: il webhook del progetto (dataset
  # production) chiama POST /repos/{owner}/{repo}/dispatches con event_type
  # "sanity-publish" (ADR-0004). Ogni build ricostruisce entrambe le versioni,
  # A e B su /b/; una modifica in `anteprima` esce con un run a mano
  # (workflow_dispatch). Pubblicazioni ravvicinate si accorpano grazie alla
  # concurrency qui sotto: parte il build dell'ultima.
  repository_dispatch:
    types: [sanity-publish]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Cache delle immagini ottimizzate da Astro (AVIF + WebP, apps/web/src/lib/foto.ts).
      # A freddo la codifica AVIF porta il build da ~25 s a ~2 min; con la cache
      # si rigenerano solo le foto nuove. Il nome di ogni file in cache tiene già
      # conto di foto, larghezza, formato e qualità, ma non delle opzioni del
      # codificatore (image.service in astro.config.mjs) né delle versioni di
      # Astro e sharp: per questo la chiave dipende da quei due file, e se
      # cambiano si riparte da zero. La cache non si sfoltisce da sola (restano
      # anche le immagini di foto tolte): se cresce troppo, cambiare `v1`.
      - uses: actions/cache@v4
        with:
          path: apps/web/node_modules/.astro/assets
          key: astro-img-v1-${{ hashFiles('apps/web/astro.config.mjs', 'pnpm-lock.yaml') }}-${{ github.run_id }}
          restore-keys: astro-img-v1-${{ hashFiles('apps/web/astro.config.mjs', 'pnpm-lock.yaml') }}-

      # Due build nello stesso artefatto (ADR-0004): la versione A da
      # `production` nella radice di dist/, la B da `anteprima` in dist/b/.
      - name: Build
        env:
          SITE: https://wearebutik.github.io
          # Tutte le chiavi PUBLIC_* sono client-side: finiscono nel bundle statico
          # per design, quindi NON sono segreti → repository *variables*, non
          # secrets. Se una variable manca, la feature relativa è un no-op e il
          # build resta verde. (turbo envMode: loose le lascia passare al build.)
          PUBLIC_WEB3FORMS_ACCESS_KEY: ${{ vars.PUBLIC_WEB3FORMS_ACCESS_KEY }}
          PUBLIC_POSTHOG_KEY: ${{ vars.PUBLIC_POSTHOG_KEY }}
          PUBLIC_POSTHOG_HOST: ${{ vars.PUBLIC_POSTHOG_HOST }}
          PUBLIC_GTM_ID: ${{ vars.PUBLIC_GTM_ID }}
        run: pnpm build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
