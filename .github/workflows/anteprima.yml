name: Anteprima delle bozze

# Binario `butik-anteprima` (ADR-0004): il sito come server locale che legge le
# bozze da Sanity. Contiene solo il codice, non i testi (li legge a ogni
# richiesta): si ricostruisce quando cambia il codice del sito, non quando si
# pubblica nello Studio. Esce come asset della Release `anteprima`, sempre
# sovrascritto: il link di download resta lo stesso.
on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'mise.toml'
      - '.github/workflows/anteprima.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: anteprima
  cancel-in-progress: true

jobs:
  binario:
    # Su macOS: Bun firma (ad hoc) il binario che compila, e su Apple Silicon
    # un binario non firmato non parte.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/prepara

      # Nessuna variabile PUBLIC_*: l'anteprima non ha analytics né form.
      - run: pnpm --filter @butik/web build:anteprima

      - name: Release `anteprima`
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp apps/web/dist-anteprima/butik-anteprima butik-anteprima-macos-arm64
          gh release view anteprima >/dev/null 2>&1 || gh release create anteprima \
            --title "Anteprima delle bozze" --prerelease \
            --notes "Binario butik-anteprima per macOS (Apple Silicon). Istruzioni in apps/web/anteprima/README.md."
          gh release upload anteprima butik-anteprima-macos-arm64 --clobber
