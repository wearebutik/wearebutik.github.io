name: CI

on:
  pull_request:
    branches: [main]
  # Anche su main: senza un build sul branch base, UI Review non ha i due build
  # che le servono per generare un changeset, e non esiste uno Storybook
  # "corrente" da linkare — solo build legati a branch di PR ormai chiusi.
  push:
    branches: [main]

jobs:
  # Parte meccanica delle regole di design (ADR-0005 #design-tokens): rossi
  # per ruolo e maiuscoletto fuori da Eyebrow/MetaLabel. Solo Node, niente
  # install. Vedi tools/design-lint/README.md.
  design-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepara
        with:
          installa: 'false'
      - run: node tools/design-lint/index.mjs

  # Controllo dei tipi con TypeScript 7: sito (anche i .astro, via
  # tools/type-check), CLI dell'anteprima e Studio. Vedi tools/type-check/README.md.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/prepara
      - run: pnpm check

  # Pubblica Storybook su Chromatic: review/commenti su ogni PR (link in fondo
  # al check) + visual regression sulla build pubblicata (ADR-0008, issue #27).
  # Questo job assorbe anche la verifica "Storybook builda ad ogni PR": se la
  # build fallisce, il job fallisce prima ancora di pubblicare. Richiede il
  # secret repo CHROMATIC_PROJECT_TOKEN (creato manualmente su chromatic.com,
  # non gestito da questo workflow) — finché non è impostato il job fallisce
  # sull'auth.
  chromatic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Chromatic confronta contro la baseline del branch base: senza la
          # storia completa non riesce a determinare il commit di baseline.
          fetch-depth: 0
      - uses: ./.github/actions/prepara
      - name: Publish to Chromatic
        uses: chromaui/action@v1
        with:
          workingDir: packages/ui
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          # Su main gli snapshot sono già stati approvati nella PR: senza
          # questo, ogni merge ne chiederebbe di nuovo l'approvazione — le
          # stesse identiche modifiche, una seconda volta. Vale solo per main;
          # sulle PR i cambiamenti restano da rivedere a mano.
          autoAcceptChanges: main
